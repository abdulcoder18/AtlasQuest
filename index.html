<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AtlasQuest — Explore the world. Learn its lore.</title>
<meta name="description" content="A free geography playground: GeoGuesser, flag quizzes, capitals, territories, historical flags and the lore of every nation.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171410'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23F5D920' stroke-width='4'/%3E%3Cellipse cx='32' cy='32' rx='19' ry='7' fill='none' stroke='%23F5D920' stroke-width='2.5'/%3E%3Cpath d='M45 45l9 9' stroke='%23F5D920' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preload" href="assets/fonts/Anton-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/SpaceMono-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="paper-frame">
    <div class="bg-orbs" aria-hidden="true">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
      <div class="grid-lines"></div>
    </div>

    <header class="topbar" id="topbar">
      <button class="iconbtn labeled" id="drawerBtn" title="Menu" aria-label="Open menu" aria-expanded="false"><span class="btn-label">Menu</span></button>
      <a class="iconbtn labeled home-btn" id="homeBtn" href="#/" title="Home" aria-label="Home">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        <span class="btn-label">Home</span>
      </a>
      <a class="brand" href="#/">
        <svg class="brand-globe" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <circle cx="18" cy="18" r="12.5" stroke="currentColor" stroke-width="2.6"/>
          <ellipse cx="18" cy="18" rx="12.5" ry="5" stroke="currentColor" stroke-width="2"/>
          <path d="M27.5 27.5 35 35" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <path d="M33 5.5l1.1 3.4 3.4 1.1-3.4 1.1-1.1 3.4-1.1-3.4-3.4-1.1 3.4-1.1z" fill="currentColor"/>
        </svg>
        <span class="brand-name">Atlas<b>Quest</b></span>
      </a>
      <div class="topbar-right">
        <a class="iconbtn labeled" id="versusBtn" href="#/versus" title="Versus — live matches"><span class="btn-label">Versus</span></a>
        <a class="iconbtn labeled" id="friendsBtn" href="#/friends" title="Friends"><span class="btn-label">Friends</span></a>
        <button class="iconbtn" id="lbBtn" title="Leaderboard" aria-label="Leaderboard"></button>
        <button class="iconbtn" id="settingsBtn" title="Settings" aria-label="Settings"><span class="btn-label">Settings</span></button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <div class="drawer-scrim" id="drawerScrim" aria-hidden="true"></div>
    <aside class="drawer" id="drawer" aria-label="Menu">
      <div class="drawer-head">
        <button class="iconbtn" id="drawerClose" title="Close menu" aria-label="Close menu"></button>
      </div>
      <button class="profile-card" id="profileCard">
        <span class="profile-ava" id="profileAva"></span>
        <span class="profile-info">
          <span class="profile-name" id="profileName">Explorer</span>
          <span class="profile-lvl" id="profileLvl">Lv 1 · Backpacker</span>
        </span>
      </button>
      <div class="drawer-xp" id="xpChip" title="XP">
        <span class="xp-bar"><span class="xp-fill" style="width:0%"></span></span>
        <span class="drawer-xp-num" id="xpNum">0 XP</span>
      </div>
      <button class="account-row" id="accountRow" hidden></button>
      <nav class="drawer-nav" id="mainnav" aria-label="Main navigation"></nav>
      <div class="drawer-foot">AtlasQuest Expedition Society</div>
    </aside>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <canvas id="confetti" class="confetti-canvas" aria-hidden="true"></canvas>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/topo/topojson-client.min.js"></script>
  <script src="vendor/mapillary/mapillary.js"></script>
  <script src="vendor/peerjs.min.js"></script>
  <script src="vendor/supabase.js"></script>
  <link rel="stylesheet" href="vendor/mapillary/mapillary.css">
  <script type="module" src="js/main.js"></script>
  <noscript>AtlasQuest needs JavaScript to run.</noscript>
  <aside class="lb-panel" id="lbPanel" aria-label="Leaderboard"></aside>

</body>
</html>
